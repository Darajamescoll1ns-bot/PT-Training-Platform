  button{width:100%;padding:14px;border:none;border-radius:13px;cursor:pointer;font-size:15px;font-weight:600;
    font-family:'Space Grotesk';color:#08101e;background:linear-gradient(120deg,#6d8bff,#36e0c8);
    box-shadow:0 12px 30px -10px rgba(80,160,255,.65), inset 0 1px 0 rgba(255,255,255,.4);transition:.25s}
  button:hover{transform:translateY(-2px)}
  button:disabled{opacity:.6;cursor:wait;transform:none}
  .err{color:#ff6b81;font-size:13.5px;margin-top:14px;min-height:18px;transition:.2s}

  .lock{font-size:12px;color:#6c7593;margin-top:20px;display:flex;gap:7px;align-items:center;justify-content:center}
  .lock svg{width:13px;height:13px;stroke:#6c7593;fill:none;stroke-width:1.8}

async function unlock(e){
  e.preventDefault();

    if(!crypto.subtle) throw new Error('insecure-context');
    const enc = new TextEncoder();
